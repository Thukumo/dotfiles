# Forgejo Actions CI.
#
# This workflow builds on the mouse-3 host runner. It is not a security
# boundary; see hosts/mouse-3/services/ci-runner.nix. On master pushes and
# workflow_dispatch from master, all nixosConfigurations, including installer,
# are built and pushed to Attic. The installer ISO image itself is not built. Committing
# Wi-Fi credentials would already leak them in this public repository, so the
# cache is not the relevant boundary. PRs only run the check steps.
#
# The Attic push token is generated by the attic-ci-tokens service and
# published as the repository Actions secret ATTIC_TOKEN.
#
# Forks are disabled in Forgejo, and the job-level `if` below is only a
# convenience filter. pull_request workflows come from the PR head, so this is
# not a sandbox: move PR checks to an isolated runner before accepting any
# untrusted collaborator.
name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: nix
    timeout-minutes: 720
    env:
      ATTIC_URL: https://cache.tsukumo.f5.si
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting and generated files
        run: |
          nix develop -c pre-commit run --all-files
          git diff --exit-code HEAD

      - name: Evaluate flake
        run: nix flake check --print-build-logs

      - name: Build all NixOS hosts
        if: forgejo.ref == 'refs/heads/master' && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          nix eval --raw .#nixosConfigurations \
            --apply 'x: builtins.concatStringsSep "\n" (builtins.attrNames x)' > .ci-hosts
          mapfile -t hosts < .ci-hosts
          if [ "${#hosts[@]}" -eq 0 ]; then
            echo "no nixosConfigurations found" >&2
            exit 1
          fi

          failed=0
          for host in "${hosts[@]}"; do
            if ! nix build --print-build-logs \
              ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --out-link "result-${host}"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Push to Attic
        if: forgejo.ref == 'refs/heads/master' && (forgejo.event_name == 'push' || forgejo.event_name == 'workflow_dispatch')
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$ATTIC_TOKEN" ]; then
            echo "missing Attic token secret" >&2
            exit 1
          fi

          mapfile -t hosts < .ci-hosts
          if [ "${#hosts[@]}" -eq 0 ]; then
            echo "no nixosConfigurations found" >&2
            exit 1
          fi

          export XDG_CONFIG_HOME="$(mktemp -d)"
          token_file="$(mktemp)"
          trap 'rm -rf "$XDG_CONFIG_HOME"; rm -f "$token_file"' EXIT
          printf '%s' "$ATTIC_TOKEN" > "$token_file"
          chmod 600 "$token_file"
          mkdir -p "$XDG_CONFIG_HOME/attic"
          cat > "$XDG_CONFIG_HOME/attic/config.toml" <<EOF
          default-server = "local"
          [servers.local]
          endpoint = "$ATTIC_URL"
          token-file = "$token_file"
          EOF
          chmod 600 "$XDG_CONFIG_HOME/attic/config.toml"

          paths=()
          for host in "${hosts[@]}"; do
            paths+=("$(nix build --no-link --print-out-paths \
              ".#nixosConfigurations.${host}.config.system.build.toplevel")")
          done

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "no store paths to push" >&2
            exit 1
          fi

          attic push dotfiles "${paths[@]}"
